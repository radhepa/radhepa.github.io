<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site editor</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
<header class="bar">
  <div class="bar-title"><strong>Site editor</strong><span id="status" class="bar-status" aria-live="polite">Loading…</span></div>
  <div class="bar-actions">
    <a id="view-link" class="abtn ghost" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button id="save" class="abtn primary" type="button" disabled>Save changes</button>
  </div>
</header>
<div class="shell">
  <nav class="tabs" aria-label="Editor sections" id="tabs"></nav>
  <main class="panel" id="panel" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="admin.js"></script>
</body>
</html>
